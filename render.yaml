services:
  - type: web
    name: call-intelligence-python-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: QDRANT_PATH
        value: /tmp/call-intelligence/qdrant
      - key: GROQ_API_KEY
        sync: false
